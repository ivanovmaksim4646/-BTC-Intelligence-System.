name: Advisory context research
on:
  push:
    branches: [research/advisory-market-coverage]
    paths:
      - 'src/advisory_context_v1.py'
      - 'src/advisory_history_v1.py'
      - 'src/advisory_events_v1.py'
      - 'tests/test_advisory_context_v1.py'
      - '.github/workflows/advisory-context-research.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_advisory_context_v1.py -v
      - run: python -m src.market_breadth_macro_v1
      - name: Read current production data without modifying main
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:data/BTC-okx-reconciled-flow-current.json > data/BTC-okx-reconciled-flow-current.json
          git show FETCH_HEAD:data/BTC-okx-reconciled-m5-history.json > data/BTC-okx-reconciled-m5-history.json
          git show FETCH_HEAD:data/BTC-okx-liquidity-history-v1.jsonl > data/BTC-okx-liquidity-history-v1.jsonl
          git show FETCH_HEAD:data/BTC-report-feed.json > data/BTC-report-feed.json
          git show FETCH_HEAD:data/BTC-okx-futures-candles.json > data/BTC-okx-futures-candles.json
          git show FETCH_HEAD:data/BTC-official-bls-fed-calendar-v1.json > data/BTC-official-bls-fed-calendar-v1.json
          git show FETCH_HEAD:data/BTC-official-bea-calendar-v1.json > data/BTC-official-bea-calendar-v1.json
      - run: python -m src.advisory_context_v1
      - run: python -m src.advisory_history_v1
      - run: python -m src.advisory_events_v1
      - uses: actions/upload-artifact@v4
        with:
          name: advisory-context
          path: |
            data/BTC-advisory-context-v1.json
            data/BTC-advisory-history-v1.json
            data/BTC-advisory-events-v1.json
