name: FTA forensic verification
on:
  push:
    branches: [research/fta-forensic-audit-v1]
    paths:
      - 'research/runner/**'
      - 'research/baseline/**'
      - 'src/binance_vision_archive.py'
      - 'src/binance_futures_candles.py'
      - 'tests/test_research_runner.py'
      - '.github/workflows/annual-backtest-runner.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  replay:
    if: github.ref == 'refs/heads/research/fta-forensic-audit-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .research-cache
          key: btc-um-m5-v1-${{ hashFiles('research/baseline/checksums.json') }}-${{ hashFiles('research/runner/config.json') }}
          restore-keys: |
            btc-um-m5-v1-${{ hashFiles('research/baseline/checksums.json') }}-
      - name: Research regression tests
        run: python -m unittest discover -s tests -p 'test_research_runner.py' -v
      - name: Replay verified archives
        run: python -m research.runner.fta_forensics
      - name: Show result and input revision
        run: |
          echo "Input commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat research/fta-forensics/summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: btc-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/fta-forensics/
          if-no-files-found: error
          retention-days: 30
      - name: Publish forensic evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/fta-forensics/
          git commit -m "data: publish FTA forensic evidence"
          git push origin HEAD:research/fta-forensic-audit-v1
