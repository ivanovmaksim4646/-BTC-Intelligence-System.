name: FTA management audit v3
on:
  push:
    branches: [research/fta-management-v3]
    paths:
      - 'research/runner/**'
      - 'research/baseline/**'
      - 'src/binance_vision_archive.py'
      - 'src/binance_futures_candles.py'
      - 'tests/test_research_runner.py'
      - '.github/workflows/annual-backtest-runner.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  replay:
    if: github.ref == 'refs/heads/research/fta-management-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .research-cache
          key: btc-um-m5-v1-${{ hashFiles('research/baseline/checksums.json') }}-${{ hashFiles('research/runner/config.json') }}
          restore-keys: |
            btc-um-m5-v1-${{ hashFiles('research/baseline/checksums.json') }}-
      - name: Research regression tests
        run: python -m unittest discover -s tests -p 'test_research_runner.py' -v
      - name: Replay verified archives
        run: python -m research.runner.risk_profile_replay
      - name: Show result and input revision
        run: |
          echo "Input commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat risk-profile-output/summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: btc-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: risk-profile-output/
          if-no-files-found: error
          retention-days: 30
      - name: Publish tables for GitHub connector
        run: |
          mkdir -p research/risk-results
          cp risk-profile-output/summary.json research/risk-results/summary.json
          cp risk-profile-output/structural-audit.json research/risk-results/structural-audit.json
          cp risk-profile-output/trades.json research/risk-results/trades.json
          python -c 'import json,os; from pathlib import Path; Path("research/risk-results/latest.json").write_text(json.dumps({"input_commit":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"]},indent=2)+"\n")'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/risk-results/
          git commit -m "data: publish structural risk research results"
          git push origin HEAD:research/fta-management-v3
