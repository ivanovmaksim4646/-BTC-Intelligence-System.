name: BTC Intelligence Sync

on:
  push:
    branches: [main]
    paths:
      - 'src/collector.py'
      - 'tests/test_collector.py'
      - '.github/workflows/btc-intelligence.yml'
  schedule:
    # Avoid the busiest minute of the hour. GitHub schedules use UTC.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Cloudflare scheduler slot (UTC)"
        required: false
        type: string
      source:
        description: "Trigger source (e.g. cloudflare)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: btc-intelligence-sync
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect Kraken data
        id: collect
        continue-on-error: true
        run: python src/collector.py

      - name: Generate BTC order-flow observations
        if: steps.collect.outcome == 'success'
        run: python src/market_analysis.py

      - name: Generate BTC structure observations
        if: steps.collect.outcome == 'success'
        run: python src/structure.py

      - name: Evaluate BTC watchlist candidates (Sweep optional)
        if: steps.collect.outcome == 'success'
        run: python src/setup_candidates.py

      - name: Record scheduler trigger diagnostics
        if: always()
        env:
          BTC_TRIGGER_EVENT: ${{ github.event_name }}
          BTC_TRIGGER_SOURCE: ${{ inputs.source }}
          BTC_TRIGGER_SLOT: ${{ inputs.slot }}
          BTC_RUN_ID: ${{ github.run_id }}
          BTC_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          path = Path('data/BTC-scheduler-health.json')
          record = {
              'schema_version': '1.0',
              'recorded_at_utc': dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00', 'Z'),
              'event': os.environ.get('BTC_TRIGGER_EVENT', ''),
              'source': os.environ.get('BTC_TRIGGER_SOURCE', '') or 'github',
              'slot': os.environ.get('BTC_TRIGGER_SLOT', ''),
              'run_id': os.environ.get('BTC_RUN_ID', ''),
              'run_attempt': os.environ.get('BTC_RUN_ATTEMPT', ''),
          }
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(record, indent=2) + '\n', encoding='utf-8')
          print('BTC scheduler:', record['event'], record['source'], 'run', record['run_id'])
          PY

      - name: Generate operational health snapshot
        if: always()
        run: python src/system_health.py

      - name: Generate synchronized BTC report feed
        if: steps.collect.outcome == 'success'
        run: python src/report_feed.py

      - name: Commit state and measurements
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        shell: bash
        run: |
          git config user.name "btc-intelligence-bot"
          git config user.email "btc-intelligence-bot@users.noreply.github.com"
          if [[ "${{ steps.collect.outcome }}" == "success" ]]; then
            git add data state
          elif [[ -f data/BTC-intelligence-errors.csv ]]; then
            git add data/BTC-intelligence-errors.csv
          fi
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: update BTC intelligence $(date -u +'%Y-%m-%dT%H:%MZ')"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          echo "Failed to push data after three attempts" >&2
          exit 1

      - name: Fail workflow when collection failed
        if: steps.collect.outcome != 'success'
        run: exit 1
