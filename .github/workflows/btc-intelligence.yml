name: BTC Intelligence Sync

on:
  push:
    branches: [main, feature/okx-flow-main-sync, feature/okx-report-confluence, feature/okx-flow-cursor, feature/okx-paper-signal-v1, feature/forward-paper-journal]
    paths:
      - 'src/collector.py'
      - 'src/forward_paper_journal_v1.py'
      - 'tests/test_forward_paper_journal_v1.py'
      - 'src/okx_paper_signal_v1.py'
      - 'tests/test_okx_paper_signal_v1.py'
      - 'src/okx_flow_history_v1.py'
      - 'tests/test_okx_flow_history_v1.py'
      - 'src/report_feed.py'
      - 'tests/test_report_feed.py'
      - 'tests/test_collector.py'
      - '.github/workflows/btc-intelligence.yml'
  schedule:
    # Avoid the busiest minute of the hour. GitHub schedules use UTC.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Cloudflare scheduler slot (UTC)"
        required: false
        type: string
      source:
        description: "Trigger source (e.g. cloudflare)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: btc-intelligence-sync-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  integration-check:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -q

  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect Kraken data
        id: collect
        continue-on-error: true
        run: python src/collector.py

      - name: Generate BTC order-flow observations
        if: steps.collect.outcome == 'success'
        run: python src/market_analysis.py

      - name: Generate BTC structure observations
        if: steps.collect.outcome == 'success'
        run: python src/structure.py

      - name: Build HTF H1 H4 D1 observational context
        if: steps.collect.outcome == 'success'
        run: python src/htf_context_v1.py

      - name: Scan IFVG H1-W1 and HTF POI with QM M5-M15 (research only)
        if: steps.collect.outcome == 'success'
        run: python src/strategy_models_v1.py

      - name: Evaluate BTC watchlist candidates (Sweep optional)
        if: steps.collect.outcome == 'success'
        run: python src/setup_candidates.py

      - name: Record scheduler trigger diagnostics
        if: always()
        env:
          BTC_TRIGGER_EVENT: ${{ github.event_name }}
          BTC_TRIGGER_SOURCE: ${{ inputs.source }}
          BTC_TRIGGER_SLOT: ${{ inputs.slot }}
          BTC_RUN_ID: ${{ github.run_id }}
          BTC_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          path = Path('data/BTC-scheduler-health.json')
          record = {
              'schema_version': '1.0',
              'recorded_at_utc': dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00', 'Z'),
              'event': os.environ.get('BTC_TRIGGER_EVENT', ''),
              'source': os.environ.get('BTC_TRIGGER_SOURCE', '') or 'github',
              'slot': os.environ.get('BTC_TRIGGER_SLOT', ''),
              'run_id': os.environ.get('BTC_RUN_ID', ''),
              'run_attempt': os.environ.get('BTC_RUN_ATTEMPT', ''),
          }
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(record, indent=2) + '\n', encoding='utf-8')
          print('BTC scheduler:', record['event'], record['source'], 'run', record['run_id'])
          PY

      - name: Generate operational health snapshot
        if: always()
        run: python src/system_health.py


      - name: Connect IFVG POI QM Delta and OI confluence (research only)
        if: steps.collect.outcome == 'success'
        run: python src/setup_confluence_v1.py

      - name: Evaluate BTC Signal Engine v1 (research only)
        if: steps.collect.outcome == 'success'
        run: python src/signal_engine_v1.py

      - name: Collect BingX futures candles (independent, nonblocking)
        id: bingx_candles
        continue-on-error: true
        run: python src/bingx_futures_probe.py

      - name: Evaluate BingX futures POI touch and QM retest (research only)
        if: steps.bingx_candles.outcome == 'success'
        continue-on-error: true
        run: python src/bingx_poi_qm_v1.py

      - name: Collect and persist reconciled OKX order flow (bounded, nonblocking)
        if: always()
        continue-on-error: true
        run: python -m src.okx_flow_history_v1

      - name: Collect OKX Futures M5-W1 closed candles (independent)
        id: okx_ict_candles
        continue-on-error: true
        run: python src/okx_futures_candles.py

      - name: Evaluate OKX futures IFVG POI QM (research only)
        if: steps.okx_ict_candles.outcome == 'success'
        continue-on-error: true
        run: python src/okx_poi_qm_v1.py

      - name: Verify TradingView alerts against closed OKX M5 and append observations (NO TRADE)
        if: always()
        run: python src/okx_setup_validator_v1.py

      - name: Evaluate BTC Risk Engine v1 (paper-only, fail-closed)
        if: always()
        run: python src/risk_engine_v1.py

      - name: Evaluate OKX Risk Engine v2 (paper-only, no execution)
        if: always()
        run: python src/risk_engine_v2_okx.py

      - name: Collect OKX BTC swap public data (independent, research only)
        if: always()
        continue-on-error: true
        run: python src/okx_futures_orderflow_v1.py

      - name: Audit OKX futures trade-page coverage and persist verified OI snapshot changes
        if: always()
        run: python src/okx_flow_coverage_v1.py

      - name: Collect OKX depth funding and mark/index snapshots (free public REST)
        if: always()
        continue-on-error: true
        run: python src/okx_liquidity_derivatives_v1.py

      - name: Accumulate verified OKX resting liquidity snapshots (no CVD claim)
        if: always()
        run: python src/okx_liquidity_history_v1.py

      - name: Analyze OKX top-three resting wall price-zone persistence (NO TRADE)
        if: always()
        run: python src/okx_wall_persistence_v1.py

      - name: Build read-only OKX snapshot context for BTC reports
        if: always()
        run: python src/okx_derivatives_context_v1.py

      - name: Evaluate OKX Liquidity Intelligence v1 (sampled observations only, NO TRADE)
        if: always()
        run: python src/okx_liquidity_intelligence_v1.py

      - name: Combine confirmed OKX M5 M15 H1 H4 price structure with liquidity intelligence (NO TRADE)
        if: always()
        run: python src/okx_market_context_v1.py

      - name: Report RR statistics from independently validated historical outcomes
        if: always()
        run: python src/rr_statistics_v1.py

      - name: Reconstruct OKX POI QM retest entry and prior confirmed target (paper evidence gate)
        if: always()
        run: python src/okx_entry_evidence_gate_v1.py

      - name: Collect public market breadth and macro context
        if: always()
        continue-on-error: true
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: python -m src.market_breadth_macro_v1

      - name: Combine current OKX evidence for research reports (no execution)
        if: always()
        continue-on-error: true
        run: python -m src.okx_confluence_v2

      - name: Evaluate synchronized OKX paper signal preview (no execution)
        if: always()
        run: python -m src.okx_paper_signal_v1

      - name: Generate synchronized BTC report feed after OKX confluence
        if: always()
        run: python src/report_feed.py

      - name: Track verified OKX paper entries and update RR outcomes (no execution)
        if: always()
        run: python src/okx_outcome_tracker_v1.py

      - name: Update prospective paper journal (admission disabled)
        if: always()
        run: python -m src.forward_paper_journal_v1

      - name: Audit BTC data-source budget and retirement readiness
        if: always()
        run: python src/source_budget_v1.py

      - name: Commit state and measurements
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        shell: bash
        run: |
          git config user.name "btc-intelligence-bot"
          git config user.email "btc-intelligence-bot@users.noreply.github.com"
          if [[ "${{ steps.collect.outcome }}" == "success" ]]; then
            git add data state
          elif [[ -f data/BTC-intelligence-errors.csv ]]; then
            git add data/BTC-intelligence-errors.csv
          fi
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: update BTC intelligence $(date -u +'%Y-%m-%dT%H:%MZ')"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          echo "Failed to push data after three attempts" >&2
          exit 1

      - name: Fail workflow when collection failed
        if: steps.collect.outcome != 'success'
        run: exit 1
