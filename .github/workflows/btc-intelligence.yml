name: BTC Intelligence Sync

on:
  schedule:
    # Avoid the busiest minute of the hour. GitHub schedules use UTC.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-intelligence-sync
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect Kraken data
        id: collect
        continue-on-error: true
        run: python src/collector.py

      - name: Commit state and measurements
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        shell: bash
        run: |
          git config user.name "btc-intelligence-bot"
          git config user.email "btc-intelligence-bot@users.noreply.github.com"
          if [[ "${{ steps.collect.outcome }}" == "success" ]]; then
            git add data state
          elif [[ -f data/BTC-intelligence-errors.csv ]]; then
            git add data/BTC-intelligence-errors.csv
          fi
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: update BTC intelligence $(date -u +'%Y-%m-%dT%H:%MZ')"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          echo "Failed to push data after three attempts" >&2
          exit 1

      - name: Fail workflow when collection failed
        if: steps.collect.outcome != 'success'
        run: exit 1
