name: Deploy BTC Cloudflare scheduler

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 250b0a0e7ffc849880ba1f6af31b3c28
          wranglerVersion: '4'
          command: deploy

      - name: Sync GitHub dispatch token to Cloudflare Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 250b0a0e7ffc849880ba1f6af31b3c28
          BTC_GITHUB_DISPATCH_TOKEN: ${{ secrets.BTC_GITHUB_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${BTC_GITHUB_DISPATCH_TOKEN:-}" ]]; then
            echo "ERROR: BTC_GITHUB_DISPATCH_TOKEN is missing from GitHub Actions repository secrets."
            exit 1
          fi
          # Pass through stdin, never command-line arguments or build output.
          printf '%s' "$BTC_GITHUB_DISPATCH_TOKEN" | npx --yes wrangler@4 secret put GITHUB_DISPATCH_TOKEN --name btc-intelligence-scheduler
          echo "Cloudflare dispatch secret synchronized."

      - name: Verify GitHub dispatch secret is configured in Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 250b0a0e7ffc849880ba1f6af31b3c28
        run: |
          set -euo pipefail
          # Only inspect secret names; never print secret values.
          npx --yes wrangler@4 secret list --name btc-intelligence-scheduler > /tmp/btc-cf-secrets.json
          python - <<'PY'
          import json
          with open('/tmp/btc-cf-secrets.json', encoding='utf-8') as f:
              secrets = json.load(f)
          names = {entry.get('name') for entry in secrets}
          if 'GITHUB_DISPATCH_TOKEN' not in names:
              print('ERROR: Cloudflare Worker is deployed, but GITHUB_DISPATCH_TOKEN is missing.')
              print('Add that secret in Cloudflare Worker Settings > Variables and Secrets.')
              raise SystemExit(1)
          print('OK: GITHUB_DISPATCH_TOKEN exists in Cloudflare (value not exposed).')
          PY
