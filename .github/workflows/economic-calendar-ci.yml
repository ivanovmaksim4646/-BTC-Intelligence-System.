name: Official economic calendar pilot
on:
  push:
    branches: [feature/official-economic-calendar]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -q
      - run: python -m src.economic_calendar_v1
