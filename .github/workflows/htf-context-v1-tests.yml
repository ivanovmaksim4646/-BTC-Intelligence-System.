name: HTF context v1 tests
on:
  push:
    branches:
      - feature/htf-context-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate HTF context syntax
        run: python -m py_compile src/htf_context_v1.py
