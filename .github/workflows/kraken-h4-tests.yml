name: Kraken Spot H4 integrity tests

on:
  push:
    branches: [main]
    paths:
      - 'src/collector.py'
      - 'tests/test_collector.py'
      - '.github/workflows/kraken-h4-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Kraken collector regression tests
        run: python -m unittest discover -s tests -p test_collector.py -v
