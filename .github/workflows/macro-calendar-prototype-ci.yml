name: Official Macro Calendar Prototype CI
on:
  push:
    branches:
      - feature/official-macro-calendar-v1
    paths:
      - 'src/macro_calendar_v1.py'
      - 'src/macro_calendar_bls_v1.py'
      - 'tests/test_macro_calendar_v1.py'
      - 'tests/test_macro_calendar_bls_v1.py'
      - '.github/workflows/macro-calendar-prototype-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test macro calendar offline
        run: python -m unittest discover -s tests -p 'test_macro_calendar*.py' -v
