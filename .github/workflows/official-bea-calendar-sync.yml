name: Official BEA Calendar Daily Sync
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-bea-calendar-sync.yml'
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-bea-calendar
  cancel-in-progress: false
jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify BEA parser offline before collection
        run: python -m unittest discover -s tests -p 'test_official_bea_calendar_v1.py' -q
      - name: Collect public-domain official future releases
        run: python -m src.official_bea_calendar_v1
      - name: Commit verified calendar only if changed
        shell: bash
        run: |
          set -euo pipefail
          git add data/BTC-official-bea-calendar-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: sync official BEA release calendar'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
