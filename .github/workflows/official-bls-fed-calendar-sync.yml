name: Official BLS Fed Calendar Daily Sync
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-bls-fed-calendar-sync.yml'
  schedule:
    - cron: '25 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-bls-fed-calendar
  cancel-in-progress: false
jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python -m unittest discover -s tests -p 'test_official_bls_fed_calendar_v1.py' -q
      - run: python -m src.official_bls_fed_calendar_v1
      - run: |
          git add data/BTC-official-bls-fed-calendar-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: sync official BLS and Fed calendar'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
