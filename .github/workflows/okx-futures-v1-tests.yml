name: OKX Futures Order Flow v1 tests and API probe
on:
  push:
    branches:
      - feature/okx-futures-orderflow-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: All regression tests
        run: python -m unittest discover -s tests -v
      - name: OKX public API probe (read only)
        run: python src/okx_futures_orderflow_v1.py
      - name: Explicit validity report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("data/BTC-okx-orderflow-v1.json").read_text())
          print("OKX status:",x["status"],"errors:",x["endpoint_errors"])
          print("Trades:",x["recent_trades"])
          print("Candles:",x["candles"],"OI:",x["open_interest"])
          assert x["m5_cvd"] is None and x["trade_signal"] is None
          PY
