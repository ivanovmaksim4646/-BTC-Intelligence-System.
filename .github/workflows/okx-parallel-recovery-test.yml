name: OKX parallel recovery regression
on:
  push:
    branches: [feature/okx-parallel-backfill-audit]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m src.okx_flow_history_v1
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-recovery-research
          path: data/BTC-okx-reconciled-flow-current.json
