name: OKX structural replay V4
on:
  workflow_dispatch:
  push:
    branches: [feature/okx-structural-replay-v4]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -q
      - run: python -m src.okx_structural_replay_v4
      - uses: actions/upload-artifact@v4
        with:
          name: okx-structural-replay-v4
          path: data/BTC-okx-structural-replay-v4.json
