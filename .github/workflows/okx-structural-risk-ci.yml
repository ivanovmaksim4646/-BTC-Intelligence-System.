name: OKX structural risk CI
on:
  push:
    branches: [feature/okx-paper-structural-risk]
  pull_request:
    paths:
      - 'src/okx_structural_risk_v3.py'
      - 'src/okx_entry_evidence_gate_v1.py'
      - 'tests/test_okx_structural_risk_v3.py'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -q
