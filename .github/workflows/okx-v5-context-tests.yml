name: OKX v5 context tests
on:
  push:
    branches: [feature/okx-structural-replay-v5]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_okx_v5_context_rules.py -v
      - run: python -m src.okx_structural_replay_v5
      - uses: actions/upload-artifact@v4
        with:
          name: okx-structural-replay-v5-partial
          path: data/BTC-okx-structural-replay-v5.json
          if-no-files-found: error
