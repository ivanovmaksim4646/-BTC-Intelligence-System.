name: BTC setup confluence v1 tests
on:
  push:
    branches:
      - feature/setup-confluence-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: All regression tests
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        run: python -m py_compile src/setup_confluence_v1.py
