name: Signal Engine v1 tests
on:
  push:
    branches:
      - feature/signal-engine-v1-observation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m py_compile src/signal_engine_v1.py
