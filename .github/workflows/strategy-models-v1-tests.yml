name: IFVG and QM strategy model tests
on:
  push:
    branches:
      - feature/ifvg-qm-strategy-models-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        run: python -m py_compile src/strategy_models_v1.py src/structure.py
